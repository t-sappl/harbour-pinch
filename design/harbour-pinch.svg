<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 172" width="172" height="172">
  <!-- Pinch app icon: one generic earbud with amber waves coming from the
       stem, where the pinch gesture happens. Drop shape of Sailwave and
       Sailcast. PNGs in icons/ are rendered from this file. --><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14233f"/>
      <stop offset="1" stop-color="#2d6a9f"/>
    </linearGradient>
    <radialGradient id="light" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </radialGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f1f4f8"/>
      <stop offset="1" stop-color="#d5deea"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36a"/>
      <stop offset="1" stop-color="#e8961a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3.2" stdDeviation="3" flood-color="#06101f" flood-opacity="0.55"/>
    </filter>
    <clipPath id="shape">
      <path d="M 86 0.6 A 85.4 85.4 0 0 1 171.4 86 A 85.4 85.4 0 0 1 86 171.4 L 10.6 171.4 A 10 10 0 0 1 0.6 161.4 L 0.6 86 A 85.4 85.4 0 0 1 86 0.6 Z"/>
    </clipPath>
  </defs><g clip-path="url(#shape)"><rect width="172" height="172" fill="url(#bg)"/><rect width="172" height="172" fill="url(#light)"/><g filter="url(#shadow)">
 <ellipse cx="104" cy="62" rx="11" ry="13" fill="#cfd9e6"/>
 <circle cx="80" cy="64" r="30" fill="url(#white)"/>
 <rect x="72" y="74" width="22" height="78" rx="11" fill="url(#white)" transform="rotate(-8 83 113)"/>
</g><g filter="url(#shadow)" fill="none" stroke="url(#amber)" stroke-width="6" stroke-linecap="round">
 <path d="M 64 100 A 22 22 0 0 0 64 128"/><path d="M 104 98 A 22 22 0 0 1 104 126"/>
 <path d="M 52 92 A 34 34 0 0 0 52 136"/><path d="M 116 90 A 34 34 0 0 1 116 134"/>
</g></g></svg>